<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Drama-Slotmaschine</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='%238b5cf6'/><stop offset='1' stop-color='%23ec4899'/></linearGradient></defs><rect width='100' height='100' rx='24' fill='url(%23g)'/><text x='50' y='70' font-family='Arial' font-weight='700' font-size='56' fill='white' text-anchor='middle'>D</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0a14; --panel:rgba(255,255,255,.06); --line:rgba(255,255,255,.12);
    --text:#f4f4fb; --muted:#a3a3c2;
    --violet:#8b5cf6; --pink:#ec4899; --cyan:#22d3ee; --lime:#a3e635; --red:#fb7185;
    --grad:linear-gradient(135deg,var(--violet),var(--pink));
  }
  *{box-sizing:border-box}
  body{
    margin:0;min-height:100vh;font-family:Inter,system-ui,sans-serif;color:var(--text);background:var(--bg);
    display:grid;place-items:center;padding:24px 16px;overflow-x:hidden;
  }
  body::before,body::after{content:"";position:fixed;width:520px;height:520px;border-radius:50%;filter:blur(120px);opacity:.35;z-index:-1}
  body::before{background:var(--violet);top:-160px;left:-120px;animation:float 14s ease-in-out infinite alternate}
  body::after{background:var(--pink);bottom:-180px;right:-120px;animation:float 16s ease-in-out infinite alternate-reverse}
  @keyframes float{to{transform:translate(80px,60px)}}
  .app{width:min(960px,100%)}
  header{display:flex;justify-content:space-between;align-items:end;gap:16px;margin-bottom:22px;flex-wrap:wrap}
  .kicker{font-family:"Space Grotesk";font-size:13px;letter-spacing:.2em;text-transform:uppercase;color:var(--cyan);margin:0 0 6px}
  h1{font-family:"Space Grotesk";font-size:clamp(34px,6vw,60px);line-height:1;margin:0;letter-spacing:-.03em}
  h1 span{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
  .pill{font-family:"Space Grotesk";font-weight:700;font-size:14px;padding:10px 16px;border-radius:999px;background:var(--panel);border:1px solid var(--line);backdrop-filter:blur(10px)}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:28px;padding:clamp(18px,4vw,36px);backdrop-filter:blur(18px);box-shadow:0 30px 80px rgba(0,0,0,.45)}
  .progress{height:6px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden;margin-bottom:22px}
  .progress div{height:100%;width:0;background:var(--grad);transition:width .4s ease}
  .reel{position:relative;height:190px;border-radius:22px;display:grid;place-items:center;overflow:hidden;
    background:radial-gradient(circle at 50% 50%,rgba(139,92,246,.25),transparent 70%),#0f0f1e;border:1px solid var(--line)}
  .reel::before,.reel::after{content:"";position:absolute;left:0;right:0;height:35%;z-index:2;pointer-events:none}
  .reel::before{top:0;background:linear-gradient(#0f0f1e,transparent)}
  .reel::after{bottom:0;background:linear-gradient(0deg,#0f0f1e,transparent)}
  .reel .line{position:absolute;left:18px;right:18px;top:50%;height:2px;background:linear-gradient(90deg,transparent,var(--cyan),transparent);opacity:.6}
  #term{position:relative;z-index:3;font-family:"Space Grotesk";font-weight:700;font-size:clamp(28px,6vw,58px);text-align:center;padding:0 20px;letter-spacing:-.02em;overflow-wrap:anywhere}
  #term.spinning{filter:blur(2px);opacity:.8}
  #term.land{animation:land .45s cubic-bezier(.2,1.6,.4,1)}
  @keyframes land{from{transform:translateY(-30px) scale(.9)}to{transform:none}}
  .hint{text-align:center;color:var(--muted);margin:18px 0 0;min-height:24px}
  .solution{display:none;margin-top:18px;padding:20px 22px;border-radius:20px;background:rgba(34,211,238,.08);border:1px solid rgba(34,211,238,.35);animation:fade .3s ease}
  .solution.show{display:block}
  .solution h3{margin:0 0 6px;font-family:"Space Grotesk";font-size:13px;letter-spacing:.15em;text-transform:uppercase;color:var(--cyan)}
  .solution p{margin:0 0 14px;font-size:18px;line-height:1.5}
  .solution p:last-of-type{margin-bottom:0}
  .rate{display:none;gap:10px;justify-content:center;margin-top:16px;flex-wrap:wrap}
  .rate.show{display:flex}
  @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  button{font:inherit;cursor:pointer;border:0;color:var(--text)}
  .actions{display:flex;justify-content:center;gap:12px;margin-top:22px;flex-wrap:wrap}
  .btn-main{font-family:"Space Grotesk";font-weight:700;font-size:20px;padding:16px 44px;border-radius:999px;background:var(--grad);
    box-shadow:0 10px 40px rgba(236,72,153,.4);transition:transform .15s,box-shadow .15s}
  .btn-main:hover{transform:translateY(-2px);box-shadow:0 14px 50px rgba(236,72,153,.55)}
  .btn-main:disabled{opacity:.5;cursor:not-allowed;transform:none}
  .btn{padding:12px 20px;border-radius:999px;background:rgba(255,255,255,.08);border:1px solid var(--line);font-weight:600;transition:background .15s}
  .btn:hover{background:rgba(255,255,255,.15)}
  .btn.check{display:none;border-color:var(--cyan);color:var(--cyan)}
  .btn.check.show{display:inline-block}
  .btn.ok{border-color:var(--lime);color:var(--lime)}
  .btn.no{border-color:var(--red);color:var(--red)}
  .btn.active{background:var(--text);color:var(--bg)}
  .toolbar{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center;margin-top:26px;padding-top:22px;border-top:1px solid var(--line)}
  .seg{display:flex;gap:6px;flex-wrap:wrap}
  .stats{display:flex;gap:16px;font-size:14px;color:var(--muted)}
  .stats b{color:var(--text);font-family:"Space Grotesk"}
  .history{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
  .chip{font-size:13px;padding:6px 12px;border-radius:999px;background:rgba(255,255,255,.06);border:1px solid var(--line)}
  .chip.ok{border-color:rgba(163,230,53,.5);color:var(--lime)}
  .chip.no{border-color:rgba(251,113,133,.5);color:var(--red)}
  .keys{text-align:center;color:var(--muted);font-size:13px;margin-top:18px}
  kbd{font-family:"Space Grotesk";padding:2px 7px;border-radius:6px;border:1px solid var(--line);background:rgba(255,255,255,.06)}
  .confetti{position:fixed;top:-20px;width:9px;height:14px;border-radius:2px;z-index:99;animation:fall 1.1s linear forwards;pointer-events:none}
  @keyframes fall{to{transform:translateY(110vh) rotate(720deg);opacity:0}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
  @media (max-width:600px){.toolbar{flex-direction:column;align-items:stretch}.stats{justify-content:center}.seg{justify-content:center}}

  /* Shiny */
  h1 span{background:linear-gradient(110deg,#8b5cf6 0%,#ec4899 35%,#fff 50%,#ec4899 65%,#8b5cf6 100%);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;animation:shine 4s linear infinite}
  @keyframes shine{from{background-position:150% 0}to{background-position:-100% 0}}
  .card{position:relative;overflow:hidden}
  .card::before{content:"";position:absolute;inset:0;border-radius:28px;padding:1px;background:linear-gradient(135deg,rgba(255,255,255,.45),transparent 30%,transparent 70%,rgba(236,72,153,.5));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
  .reel{box-shadow:inset 0 1px 0 rgba(255,255,255,.15),0 0 40px rgba(139,92,246,.25)}
  .reel .sheen{position:absolute;inset:0;z-index:4;pointer-events:none;background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.18) 50%,transparent 65%);transform:translateX(-100%)}
  .reel.flash .sheen{animation:sweep .9s ease-out}
  @keyframes sweep{to{transform:translateX(100%)}}
  #term{text-shadow:0 0 24px rgba(236,72,153,.55),0 0 2px #fff}
  .btn-main{position:relative;overflow:hidden;box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 10px 40px rgba(236,72,153,.45)}
  .btn-main::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);transform:skewX(-20deg);animation:btnshine 3s ease-in-out infinite}
  @keyframes btnshine{0%,60%{left:-60%}100%{left:130%}}
  .progress div{box-shadow:0 0 12px rgba(236,72,153,.8)}
  .pill{background:linear-gradient(135deg,rgba(255,255,255,.18),rgba(255,255,255,.04))}
  .sparkle{position:fixed;width:6px;height:6px;border-radius:50%;background:#fff;box-shadow:0 0 10px #fff,0 0 20px #ec4899;pointer-events:none;z-index:98;animation:twinkle .9s ease-out forwards}
  @keyframes twinkle{to{transform:translate(var(--dx),var(--dy)) scale(0);opacity:0}}

  /* Level + Lernliste */
  .levels{display:flex;justify-content:center;gap:8px;margin-bottom:18px;flex-wrap:wrap}
  .lvl{padding:10px 18px;border-radius:999px;background:rgba(255,255,255,.06);border:1px solid var(--line);font-weight:600;font-size:14px;transition:all .2s}
  .lvl small{display:block;font-weight:400;font-size:11px;color:var(--muted)}
  .lvl.active{background:var(--grad);border-color:transparent;box-shadow:0 0 24px rgba(236,72,153,.45)}
  .lvl.active small{color:rgba(255,255,255,.85)}
  .reel.long{height:auto;min-height:190px;padding:34px 0}
  .reel.long #term{font-family:Inter;font-weight:600;font-size:clamp(18px,2.6vw,26px);line-height:1.45;letter-spacing:0;max-width:760px;text-shadow:none}
  .overlay{position:fixed;inset:0;z-index:200;background:rgba(5,5,12,.75);backdrop-filter:blur(8px);display:none;place-items:center;padding:16px}
  .overlay.show{display:grid;animation:fade .25s ease}
  .sheet{width:min(860px,100%);max-height:88vh;display:flex;flex-direction:column;background:#12121f;border:1px solid var(--line);border-radius:26px;box-shadow:0 30px 90px rgba(0,0,0,.6);overflow:hidden}
  .sheet-head{display:flex;gap:12px;align-items:center;padding:20px 22px;border-bottom:1px solid var(--line);flex-wrap:wrap}
  .sheet-head h2{font-family:"Space Grotesk";margin:0;font-size:24px;flex:1}
  .search{flex:1 1 220px;padding:11px 16px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.06);color:var(--text);font:inherit}
  .search:focus{outline:none;border-color:var(--violet)}
  .list{overflow-y:auto;padding:10px 22px 22px}
  .entry{padding:16px 0;border-bottom:1px solid var(--line)}
  .entry:last-child{border-bottom:0}
  .entry h4{margin:0 0 6px;font-family:"Space Grotesk";font-size:19px;display:flex;align-items:center;gap:10px}
  .entry h4 .tag{font-family:Inter;font-size:11px;font-weight:600;padding:3px 9px;border-radius:99px}
  .tag.ok{background:rgba(163,230,53,.15);color:var(--lime)}
  .tag.no{background:rgba(251,113,133,.15);color:var(--red)}
  .entry p{margin:0;color:#d6d6e8;line-height:1.5}
  .entry .exm{margin-top:8px;line-height:1.5;font-size:14px;color:var(--muted)}
  .entry .exm b{color:var(--cyan);font-weight:600}
  .empty{color:var(--muted);text-align:center;padding:30px 0}

  /* Responsive */
  html{-webkit-text-size-adjust:100%}
  button{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
  body{padding:max(24px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(24px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
  body::before,body::after{width:min(520px,90vw);height:min(520px,90vw)}
  .stats{flex-wrap:wrap}
  @media (hover:none){.keys{display:none}.btn-main:hover{transform:none}}
  @media (max-width:700px){
    body{place-items:start center;padding-top:max(16px,env(safe-area-inset-top))}
    header{align-items:flex-start;margin-bottom:16px}
    .pill{font-size:12px;padding:7px 12px}
    .card{border-radius:22px;padding:16px}
    .card::before{border-radius:22px}
    .levels{display:grid;grid-template-columns:1fr 1fr;gap:8px}
    .lvl{padding:10px 8px;font-size:14px}
    .reel{height:150px;border-radius:18px}
    .reel.long{min-height:150px;padding:26px 0}
    .reel.long #term{font-size:17px;padding:0 16px}
    .hint{font-size:14px}
    .actions{flex-direction:column;align-items:stretch}
    .btn-main{width:100%;padding:16px}
    .btn.check.show{display:block;width:100%}
    .solution{padding:16px}
    .solution p{font-size:16px}
    .rate{display:none;grid-template-columns:1fr 1fr}
    .rate.show{display:grid}
    .rate .btn{padding:14px 8px}
    .toolbar{flex-direction:column;align-items:stretch;gap:8px}
    .seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
    .seg .btn{padding:12px 8px;font-size:14px}
    #modeTrain{grid-column:1/-1}
    .seg:last-child{grid-template-columns:1fr 1fr 1fr}
    .stats{justify-content:center;gap:10px 16px}
    .chip{font-size:12px}
    .overlay{padding:0;place-items:end stretch}
    .sheet{width:100%;max-height:92vh;border-radius:22px 22px 0 0}
    .sheet-head{padding:16px}
    .sheet-head h2{font-size:20px}
    .search{order:3;flex-basis:100%}
    .list{padding:4px 16px calc(16px + env(safe-area-inset-bottom))}
    .entry h4{font-size:17px;flex-wrap:wrap}
    .entry p{font-size:15px}
  }
  @media (max-width:360px){.seg:last-child{grid-template-columns:1fr 1fr}#fsBtn{display:none}.lvl small{font-size:10px}}
  @media (max-height:500px) and (orientation:landscape){.reel{height:120px}.reel.long{min-height:120px}header{margin-bottom:10px}h1{font-size:30px}}
</style>
</head>
<body>
<main class="app">
  <header>
    <div>
      <p class="kicker">Deutsch · Dramentheorie</p>
      <h1>Drama-<span>Slotmaschine</span></h1>
    </div>
    <div class="pill" id="countPill"></div>
  </header>

  <section class="card">
    <div class="levels">
      <button class="lvl active" id="lvl1">Level 1<small>Begriff → erklären</small></button>
      <button class="lvl" id="lvl2">Level 2<small>Erklärung → Begriff nennen</small></button>
    </div>
    <div class="progress"><div id="bar"></div></div>
    <div class="reel" id="reel"><div class="line"></div><div class="sheen"></div><div id="term">Bereit?</div></div>
    <p class="hint" id="hint">Drück auf „Drehen“ und erkläre den Begriff, der erscheint.</p>

    <div class="actions">
      <button class="btn-main" id="spinBtn">Drehen</button>
      <button class="btn check" id="checkBtn">Lösung checken</button>
    </div>

    <div class="solution" id="solution">
      <h3 id="solHead">Erklärung</h3><p id="expl"></p>
      <h3 id="exHead">Beispiel aus der deutschen Literatur</h3><p id="ex"></p>
    </div>
    <div class="rate" id="rate">
      <button class="btn ok" id="okBtn">✓ Gewusst</button>
      <button class="btn no" id="noBtn">✗ Nochmal üben</button>
    </div>

    <div class="toolbar">
      <div class="seg">
        <button class="btn active" id="modeNoRep">Ohne Wiederholung</button>
        <button class="btn" id="modeRep">Mit Wiederholung</button>
        <button class="btn" id="modeTrain">Nur „Nochmal üben“</button>
      </div>
      <div class="seg">
        <button class="btn" id="listBtn">Lernliste</button>
        <button class="btn" id="resetBtn">Zurücksetzen</button>
        <button class="btn" id="fsBtn">Vollbild</button>
      </div>
    </div>
    <div class="stats" style="margin-top:16px">
      <span>Gezogen <b id="sDrawn">0</b></span>
      <span>Gewusst <b id="sOk">0</b></span>
      <span>Üben <b id="sNo">0</b></span>
      <span id="sLeftWrap">Im Topf <b id="sLeft">0</b></span>
    </div>
    <div class="history" id="history"></div>
    <p class="keys"><kbd>Leertaste</kbd> drehen · <kbd>Enter</kbd> Lösung · <kbd>J</kbd> gewusst · <kbd>N</kbd> üben · <kbd>L</kbd> Lernliste</p>
  </section>
</main>

<div class="overlay" id="overlay">
  <div class="sheet" role="dialog" aria-label="Lernliste">
    <div class="sheet-head">
      <h2>Lernliste</h2>
      <input class="search" id="search" type="search" placeholder="Begriff suchen …">
      <button class="btn" id="closeList">Schliessen</button>
    </div>
    <div class="list" id="list"></div>
  </div>
</div>

<script>
const TERMS = [
  {term:"absurdes Theater",
   explanation:"Theaterform der 1950er/60er-Jahre, die eine sinnentleerte, widersprüchliche Welt zeigt; Handlung und Sprache wirken oft zusammenhanglos, die Figuren warten oder reden aneinander vorbei.",
   l2:"Theaterform der 1950er/60er-Jahre, die eine sinnlose, widersprüchliche Welt zeigt; Handlung und Sprache wirken zusammenhanglos, die Figuren reden aneinander vorbei.",
   example:""},
  {term:"analytisches Drama",
   explanation:"Die entscheidenden Ereignisse liegen vor Beginn der Bühnenhandlung und werden Schritt für Schritt aufgedeckt (Enthüllungsdrama).",
   l2:"Die entscheidenden Ereignisse liegen vor Beginn der Bühnenhandlung; das Stück deckt sie nach und nach auf.",
   example:"Kleist, „Der zerbrochne Krug“: Dorfrichter Adam muss darüber Gericht halten, wer in der Nacht im Zimmer von Eve war und dabei den Krug ihrer Mutter Marthe zerbrochen hat. Im Verlauf der Verhandlung kommt Stück für Stück heraus, dass Adam selbst der Täter ist. Die eigentliche Tat liegt also vor Beginn des Stücks – auf der Bühne wird sie nur noch aufgedeckt."},
  {term:"aristotelisches Drama",
   explanation:"Dramenform, die sich auf die Poetik des Aristoteles beruft: geschlossene, einheitliche Handlung, die beim Publikum Einfühlung und Katharsis bewirken soll. Aristoteles forderte v. a. die Einheit der Handlung; die strengen drei Einheiten (Ort, Zeit, Handlung) wurden erst später, besonders in der französischen Klassik, daraus abgeleitet.",
   l2:"Dramenform, die sich auf die Poetik eines antiken griechischen Philosophen beruft: geschlossene, einheitliche Handlung, die die Zuschauer mitfühlen lässt und innerlich läutern soll.",
   example:"Lessing, „Emilia Galotti“: Der Prinz begehrt die bürgerliche Emilia, die am selben Tag den Grafen Appiani heiraten will. Sein Kammerherr Marinelli lässt die Hochzeitskutsche überfallen, Appiani wird getötet, Emilia ins Lustschloss des Prinzen gebracht. Um sie vor dem Prinzen zu bewahren, ersticht ihr Vater Odoardo sie auf ihre Bitte hin. Die Handlung ist straff, spielt an einem einzigen Tag und soll das Publikum mitleiden lassen."},
  {term:"Pyramiden-Modell",
   explanation:"Bauform des Dramas nach Gustav Freytag (1863): Exposition – steigende Handlung (erregendes Moment) – Höhepunkt/Peripetie – fallende Handlung (retardierendes Moment) – Katastrophe.",
   l2:"Fünfteiliges Bauschema eines Dramas aus dem 19. Jahrhundert: Einleitung – steigende Handlung – Höhepunkt – fallende Handlung – Katastrophe.",
   example:"Schiller, „Kabale und Liebe“: Exposition – der Adlige Ferdinand liebt die Musikertochter Luise Miller. Steigende Handlung – sein Vater, der Präsident, will ihn mit Lady Milford verheiraten und plant mit seinem Sekretär Wurm eine Intrige. Höhepunkt – Luise wird gezwungen, einen falschen Liebesbrief an den Hofmarschall von Kalb zu schreiben. Fallende Handlung – Ferdinand erhält den Brief und glaubt an ihre Untreue. Katastrophe – er vergiftet Luise und sich selbst; sterbend erfährt er die Wahrheit."},
  {term:"Botenbericht",
   explanation:"Eine Figur berichtet von Ereignissen, die nicht auf der Bühne gezeigt werden (zeitlich oder räumlich entfernt), z. B. weil sie zu grausam oder nicht darstellbar sind.",
   l2:"Eine Figur erzählt von Ereignissen, die anderswo oder früher geschehen sind und nicht auf der Bühne gezeigt werden.",
   example:"Kleist, „Penthesilea“: Achilles will sich der Amazonenkönigin Penthesilea zum Schein im Zweikampf ergeben. Sie missversteht seine Herausforderung, tötet ihn mit einem Pfeil und zerfleischt ihn zusammen mit ihren Hunden. Diese grausame Szene wird nicht gespielt – die Amazone Meroe berichtet sie."},
  {term:"Deus ex Machina",
   explanation:"„Gott aus der Maschine“: unerwartete Lösung eines Konflikts durch eine plötzlich eingreifende äußere Macht.",
   l2:"Ein scheinbar auswegloser Konflikt löst sich plötzlich durch eine unerwartet eingreifende äußere Macht.",
   example:"Brecht, „Die Dreigroschenoper“: Der Gangster Macheath steht schon unter dem Galgen, als ein reitender Bote der Königin erscheint. Er bringt die Begnadigung und dazu noch einen Adelstitel, ein Schloss und eine Rente. Brecht setzt das bewusst übertrieben ein, um das „glückliche Ende“ als unrealistisch zu entlarven."},
  {term:"dokumentarisches Theater",
   explanation:"Theaterform, die mit authentischem Material wie Akten, Protokollen, Interviews oder Berichten arbeitet.",
   l2:"Theaterform, die authentisches Material wie Gerichtsakten, Protokolle oder Interviews auf die Bühne bringt.",
   example:"Peter Weiss, „Die Ermittlung“ (1965): Das Stück beruht auf dem Frankfurter Auschwitz-Prozess. Weiss hat Aussagen von Zeugen und Angeklagten aus Prozessberichten zusammengestellt; es gibt keine erfundene Handlung, sondern das Publikum erlebt die Befragungen wie in einem Gerichtssaal."},
  {term:"episches Theater",
   explanation:"Theaterform nach Bertolt Brecht: Durch Verfremdungseffekte (z. B. Songs, Spruchbänder, direkte Publikumsansprache) soll Distanz entstehen und das Publikum kritisch nachdenken.",
   l2:"Theaterform des 20. Jahrhunderts, die mit Verfremdung (Songs, Spruchbänder, Publikumsansprache) Distanz schafft, damit das Publikum kritisch urteilt statt mitzufühlen.",
   example:"Brecht, „Mutter Courage und ihre Kinder“: Die Händlerin Anna Fierling, genannt Mutter Courage, zieht im Dreißigjährigen Krieg mit ihrem Planwagen hinter den Heeren her und will am Krieg verdienen. Dabei verliert sie nacheinander ihre drei Kinder. Am Ende zieht sie allein weiter, ohne etwas gelernt zu haben. Szenentitel verraten vorab, was passiert, und Songs unterbrechen die Handlung – so soll das Publikum über den Krieg urteilen, statt nur mitzuleiden."},
  {term:"Exposition",
   explanation:"Einführung in Ausgangssituation, Figuren, Ort, Zeit und Grundkonflikt, meist im ersten Akt.",
   l2:"Einführender Teil eines Dramas, der Figuren, Ort, Zeit und Grundkonflikt vorstellt.",
   example:"Schiller, „Kabale und Liebe“, I. Akt, 1. Szene: Der Musiker Miller streitet mit seiner Frau über die Besuche des adligen Majors Ferdinand bei ihrer Tochter Luise. Miller fürchtet Schande wegen des Standesunterschieds, seine Frau hofft auf sozialen Aufstieg. So kennt das Publikum sofort die Figuren und den zentralen Konflikt zwischen Adel und Bürgertum."},
  {term:"Fallhöhe",
   explanation:"Abstand zwischen der hohen gesellschaftlichen Stellung einer Figur und ihrem Sturz; je höher die Stellung, desto tragischer der Fall.",
   l2:"Abstand zwischen der hohen gesellschaftlichen Stellung einer Figur und ihrem Untergang – je grösser er ist, desto tragischer wirkt das Ende.",
   example:"Schiller, „Maria Stuart“: Maria war Königin von Schottland. Nach ihrer Flucht nach England wird sie von Königin Elisabeth jahrelang gefangen gehalten, schließlich zum Tod verurteilt und hingerichtet. Der Sturz von der Königin zur Hingerichteten macht ihr Schicksal besonders tragisch."},
  {term:"geschlossenes Drama",
   explanation:"Dramenform mit einheitlicher, linearer Handlung, wenigen Figuren und Schauplätzen, engem Zeitrahmen und strengem Aufbau (oft fünf Akte, gehobene Sprache).",
   l2:"Dramenform mit einheitlicher, linearer Handlung, wenigen Figuren und Orten, engem Zeitrahmen, streng gebautem Aufbau und gehobener Sprache.",
   example:"Goethe, „Iphigenie auf Tauris“: Iphigenie lebt als Priesterin bei König Thoas. Ihr Bruder Orest und sein Freund Pylades landen auf der Insel und sollen geopfert werden. Statt gemeinsam mit ihnen zu fliehen und den König zu betrügen, sagt Iphigenie Thoas die Wahrheit – und er lässt sie ziehen. Das Stück hat fünf Akte, spielt an einem einzigen Ort (vor dem Tempel), mit nur fünf Figuren und in Versen."},
  {term:"Katharsis",
   explanation:"Nach Aristoteles die Reinigung/Läuterung des Publikums durch das Erleben von „Jammer und Schaudern“ (Lessing: „Mitleid und Furcht“).",
   l2:"Nach Aristoteles die Wirkung der Tragödie: Die Zuschauer werden durch Mitleid und Furcht innerlich geläutert.",
   example:"Lessing, „Emilia Galotti“: Das Publikum fühlt mit Emilia, die der Willkür des Prinzen ausgeliefert ist und am Ende von ihrem eigenen Vater getötet wird. Weil Emilia eine bürgerliche Figur ist, können sich die Zuschauer mit ihr identifizieren: Sie empfinden Mitleid mit ihr und Furcht, Ähnliches könnte auch ihnen geschehen."},
  {term:"Monolog",
   explanation:"Längere Rede einer Figur, die allein auf der Bühne ist oder sich nicht an andere Figuren richtet; zeigt oft innere Konflikte.",
   l2:"Längere Rede einer Figur, die allein ist oder sich an niemanden richtet; macht oft innere Konflikte hörbar.",
   example:"Goethe, „Faust I“, Szene „Nacht“: Faust sitzt allein in seinem Studierzimmer und klagt, dass er Philosophie, Jura, Medizin und Theologie studiert habe und trotzdem nicht wisse, was die Welt im Innersten zusammenhält. Aus dieser Verzweiflung heraus wendet er sich der Magie zu."},
  {term:"offenes Drama",
   explanation:"Dramenform mit lockerer Struktur: viele Orte und Figuren, Zeitsprünge, lose aneinandergereihte Szenen, oft offener Schluss und alltagsnahe Sprache.",
   l2:"Dramenform mit lockerer Struktur: viele Orte und Figuren, Zeitsprünge, lose Szenenfolge, alltagsnahe Sprache und oft ein unabgeschlossener Schluss.",
   example:"Büchner, „Woyzeck“: Der einfache Soldat Woyzeck wird von seinem Hauptmann gedemütigt und vom Doktor für ein Experiment missbraucht, bei dem er nur Erbsen essen darf. Als seine Freundin Marie ihn mit dem Tambourmajor betrügt, ersticht er sie. Das Stück besteht aus kurzen, lose verbundenen Szenen an vielen Orten; es ist ein Fragment, die Reihenfolge der Szenen ist nicht endgültig festgelegt."},
  {term:"Peripetie",
   explanation:"Wendepunkt der Handlung, an dem sich das Schicksal des Helden entscheidend umkehrt (meist zum Schlechten).",
   l2:"Entscheidender Wendepunkt, an dem sich das Schicksal der Hauptfigur umkehrt.",
   example:"Schiller, „Maria Stuart“, III. Akt: Maria trifft Elisabeth im Park und hofft auf Gnade. Doch Elisabeth demütigt sie, und Maria verliert die Beherrschung und beleidigt Elisabeth vor deren Hofleuten. Danach wendet sich alles gegen Maria: Ein Mordanschlag auf Elisabeth folgt, und Elisabeth unterschreibt schließlich das Todesurteil."},
  {term:"Prolog",
   explanation:"Einleitender Teil vor der eigentlichen Handlung, der z. B. ins Thema einführt oder das Publikum anspricht.",
   l2:"Teil vor der eigentlichen Handlung, der ins Thema einführt oder das Publikum anspricht.",
   example:"Goethe, „Faust I“, „Prolog im Himmel“: Noch bevor Faust auftritt, wettet Mephisto mit dem Herrn, dass er Faust vom rechten Weg abbringen kann. Der Herr erlaubt es ihm, solange Faust auf Erden lebt. Damit ist der Rahmen für das ganze Stück gesetzt."},
  {term:"Retardation",
   explanation:"Verzögerung der Handlung kurz vor der Katastrophe (retardierendes Moment); weckt noch einmal Hoffnung und steigert die Spannung.",
   l2:"Verzögerung kurz vor der Katastrophe, die noch einmal Hoffnung auf einen guten Ausgang weckt und die Spannung steigert.",
   example:"Schiller, „Maria Stuart“, IV. Akt: Das Todesurteil liegt bereit, doch Elisabeth zögert. Der Graf Talbot bittet eindringlich um Gnade für Maria. Elisabeth unterschreibt zwar, übergibt das Urteil aber dem Staatssekretär Davison ohne klaren Befehl. Für einen Moment scheint Marias Rettung noch möglich."},
  {term:"Sekundenstil",
   explanation:"Darstellungstechnik des Naturalismus: Vorgänge werden so genau wiedergegeben, dass erzählte Zeit und Erzählzeit fast gleich sind (inkl. Pausen, Geräusche, Dialekt).",
   l2:"Technik des Naturalismus: Vorgänge werden mit allen Pausen, Geräuschen und Dialektfärbungen so genau wiedergegeben, dass sie fast in Echtzeit ablaufen.",
   example:"Arno Holz/Johannes Schlaf, „Die Familie Selicke“: An einem Heiligabend wartet eine arme Berliner Familie auf den Vater, der betrunken heimkommt; die kleine Tochter Linchen ist schwer krank und stirbt in dieser Nacht. Lange Regieanweisungen halten jede Geste, jedes Geräusch und jede Pause fest, die Figuren sprechen Berliner Umgangssprache."},
  {term:"Ständeklausel",
   explanation:"Regel der Barock- und frühaufklärerischen Poetik: Tragödien zeigen Figuren hohen Standes, Komödien Figuren niedrigeren Standes. Im bürgerlichen Trauerspiel wird sie aufgehoben.",
   l2:"Regel der Barockpoetik: Nur Könige und Adlige sind „tragödienfähig“, Bürger und Bauern gehören in die Komödie.",
   example:"Schiller, „Kabale und Liebe“ (Gegenbeispiel): Die tragische Heldin ist Luise, die Tochter eines einfachen Musikers. Ihr Leiden und ihr Tod werden ernst genommen – ein Bürgermädchen wird zur Tragödienfigur. Damit ist die alte Regel aufgehoben."},
  {term:"synthetisches Drama",
   explanation:"Zieldrama: Die Handlung entwickelt sich vorwärts auf der Bühne; die entscheidenden Ereignisse geschehen im Verlauf des Stücks.",
   l2:"Die Handlung entwickelt sich zielgerichtet vorwärts; die entscheidenden Ereignisse geschehen erst im Verlauf des Stücks vor den Augen des Publikums.",
   example:"Lessing, „Emilia Galotti“: Zu Beginn erfährt der Prinz, dass Emilia heiraten will. Erst dann setzt die Intrige ein: der Überfall auf die Kutsche, Appianis Tod, Emilias Entführung und schließlich ihr Tod. Alles Entscheidende geschieht im Verlauf des Stücks – nichts muss aus der Vorgeschichte enthüllt werden."},
  {term:"Stichomythie",
   explanation:"Schneller Redewechsel, bei dem sich zwei Figuren Vers um Vers (oder Satz um Satz) antworten; zeigt meist einen zugespitzten Konflikt.",
   l2:"Schneller Redewechsel, bei dem zwei Figuren einander Vers um Vers antworten; meist Zeichen eines zugespitzten Streits.",
   example:""},
  {term:"Teichoskopie",
   explanation:"„Mauerschau“: Eine Figur beschreibt ein gleichzeitig stattfindendes Ereignis, das sie sieht, das aber auf der Bühne nicht gezeigt wird.",
   l2:"Eine Figur schildert – z. B. von einem erhöhten Standort aus – ein gleichzeitig stattfindendes Ereignis, das das Publikum nicht sieht.",
   example:"Schiller, „Die Jungfrau von Orleans“, V. Akt: Johanna liegt in Ketten bei den Engländern gefangen. Ein Soldat beobachtet von einem Wachturm aus die Schlacht und schildert, wie der französische König in Bedrängnis gerät. Die Schlacht selbst sieht das Publikum nicht. Daraufhin zerreißt Johanna ihre Ketten und eilt in den Kampf."}
];

const $ = id => document.getElementById(id);
let level = 1, mode = "norep", pool = [], drawn = [], ok = new Set(), no = new Set(), current = null, spinning = false;

function buildPool(){
  if (mode === "train") pool = TERMS.filter(t => no.has(t.term));
  else pool = [...TERMS];
}
function update(){
  $("countPill").textContent = `${TERMS.length} Begriffe`;
  $("sDrawn").textContent = drawn.length;
  $("sOk").textContent = ok.size;
  $("sNo").textContent = no.size;
  $("sLeft").textContent = pool.length;
  $("sLeftWrap").style.display = mode === "rep" ? "none" : "";
  $("bar").style.width = (ok.size / TERMS.length * 100) + "%";
  $("history").innerHTML = "";
  drawn.slice(-12).reverse().forEach(t => {
    const c = document.createElement("span");
    c.className = "chip" + (ok.has(t.term) ? " ok" : no.has(t.term) ? " no" : "");
    c.textContent = t.term;
    $("history").appendChild(c);
  });
}
function hideSolution(){
  $("solution").classList.remove("show");
  $("rate").classList.remove("show");
  $("checkBtn").classList.remove("show");
}
const shown = t => level === 1 ? t.term : t.l2;
function setLevel(l){
  level = l;
  $("lvl1").classList.toggle("active", l === 1);
  $("lvl2").classList.toggle("active", l === 2);
  $("reel").classList.toggle("long", l === 2);
  current = null; hideSolution();
  $("term").textContent = "Bereit?";
  $("hint").textContent = l === 1 ? "Level 1: Erkläre den Begriff, der erscheint." : "Level 2: Lies die Erklärung und nenne den passenden Begriff.";
}
function setMode(m){
  mode = m;
  [["modeNoRep","norep"],["modeRep","rep"],["modeTrain","train"]].forEach(([id,v]) => $(id).classList.toggle("active", v === m));
  buildPool(); current = null; hideSolution();
  $("term").textContent = "Bereit?";
  $("hint").textContent = m === "train" && !pool.length ? "Noch keine Begriffe zum Üben markiert." : "Drück auf „Drehen“.";
  update();
}
function reset(){ drawn = []; ok.clear(); no.clear(); setMode(mode === "train" ? "norep" : mode); }
const rand = a => a[Math.floor(Math.random() * a.length)];

function spin(){
  if (spinning) return;
  if (mode !== "rep" && !pool.length){
    if (mode === "train"){ $("hint").textContent = "Super, nichts mehr zu üben!"; return; }
    buildPool();
  }
  spinning = true; $("spinBtn").disabled = true; hideSolution();
  $("term").classList.add("spinning"); $("hint").textContent = "Die Walze dreht …";
  const src = mode === "train" ? pool : TERMS;
  let ticks = 0, max = 26 + Math.floor(Math.random() * 10), delay = 50;
  (function tick(){
    $("term").textContent = level === 1 ? rand(src).term : rand(src).l2.slice(0, 60) + " …";
    if (++ticks < max){ delay += ticks > max - 8 ? 25 : 0; setTimeout(tick, delay); return; }
    current = rand(pool.length ? pool : TERMS);
    if (mode !== "rep") pool = pool.filter(t => t.term !== current.term);
    drawn.push(current);
    const el = $("term");
    el.classList.remove("spinning"); el.textContent = shown(current);
    el.classList.remove("land"); void el.offsetWidth; el.classList.add("land");
    $("hint").textContent = level === 1 ? "Erkläre den Begriff und nenne ein Beispiel – dann checken!" : "Welcher Begriff ist gemeint? Nenne ihn – dann checken!";
    $("checkBtn").classList.add("show");
    spinning = false; $("spinBtn").disabled = false;
    const r=$("reel"); r.classList.remove("flash"); void r.offsetWidth; r.classList.add("flash");
    confetti(); sparkles(); update();
  })();
}
function check(){
  if (!current || spinning) return;
  $("solHead").textContent = level === 1 ? "Erklärung" : "Gesuchter Begriff";
  $("expl").textContent = level === 1 ? current.explanation : current.term;
  $("ex").textContent = current.example;
  $("exHead").style.display = $("ex").style.display = current.example ? "" : "none";
  $("solution").classList.add("show");
  $("rate").classList.add("show");
  $("checkBtn").classList.remove("show");
}
function rate(knew){
  if (!current) return;
  if (knew){ ok.add(current.term); no.delete(current.term); }
  else { no.add(current.term); ok.delete(current.term); }
  $("rate").classList.remove("show");
  $("hint").textContent = knew ? "Stark! Weiter geht’s." : "Kommt in den Übungsstapel.";
  update();
}
function confetti(){
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const cols = ["#8b5cf6","#ec4899","#22d3ee","#a3e635"];
  for (let i = 0; i < 40; i++){
    const p = document.createElement("div");
    p.className = "confetti";
    p.style.left = Math.random()*100 + "vw";
    p.style.background = rand(cols);
    p.style.animationDelay = Math.random()*200 + "ms";
    document.body.appendChild(p);
    setTimeout(() => p.remove(), 1400);
  }
}

function sparkles(){
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const b=$("reel").getBoundingClientRect();
  for(let i=0;i<18;i++){
    const s=document.createElement("div"); s.className="sparkle";
    s.style.left=(b.left+b.width/2)+"px"; s.style.top=(b.top+b.height/2)+"px";
    const a=Math.random()*Math.PI*2, d=80+Math.random()*160;
    s.style.setProperty("--dx",Math.cos(a)*d+"px"); s.style.setProperty("--dy",Math.sin(a)*d*0.6+"px");
    document.body.appendChild(s); setTimeout(()=>s.remove(),1000);
  }
}
function renderList(){
  const q = $("search").value.trim().toLowerCase();
  const items = [...TERMS].sort((a,b) => a.term.localeCompare(b.term, "de"))
    .filter(t => !q || (t.term + " " + t.explanation + " " + t.example).toLowerCase().includes(q));
  const box = $("list"); box.innerHTML = "";
  if (!items.length){ box.innerHTML = '<p class="empty">Kein Treffer.</p>'; return; }
  items.forEach(t => {
    const d = document.createElement("div"); d.className = "entry";
    const h = document.createElement("h4"); h.textContent = t.term;
    if (ok.has(t.term)){ const g=document.createElement("span"); g.className="tag ok"; g.textContent="gewusst"; h.appendChild(g); }
    if (no.has(t.term)){ const g=document.createElement("span"); g.className="tag no"; g.textContent="üben"; h.appendChild(g); }
    const p = document.createElement("p"); p.textContent = t.explanation;
    const e = document.createElement("p"); e.className = "exm"; e.innerHTML = "<b>Beispiel:</b> "; e.append(t.example);
    d.append(h, p); if (t.example) d.append(e); box.appendChild(d);
  });
}
const listOpen = () => $("overlay").classList.contains("show");
function openList(){ renderList(); $("overlay").classList.add("show"); $("search").focus(); }
function closeList(){ $("overlay").classList.remove("show"); $("search").value = ""; }
$("listBtn").onclick = openList;
$("closeList").onclick = closeList;
$("overlay").onclick = e => { if (e.target.id === "overlay") closeList(); };
$("search").oninput = renderList;
$("lvl1").onclick = () => setLevel(1);
$("lvl2").onclick = () => setLevel(2);
$("spinBtn").onclick = spin;
$("checkBtn").onclick = check;
$("okBtn").onclick = () => rate(true);
$("noBtn").onclick = () => rate(false);
$("modeNoRep").onclick = () => setMode("norep");
$("modeRep").onclick = () => setMode("rep");
$("modeTrain").onclick = () => setMode("train");
$("resetBtn").onclick = reset;
$("fsBtn").onclick = () => document.fullscreenElement ? document.exitFullscreen?.() : document.documentElement.requestFullscreen?.();
document.addEventListener("keydown", e => {
  if (listOpen()){ if (e.key === "Escape") closeList(); return; }
  if (e.key.toLowerCase() === "l"){ openList(); e.preventDefault(); return; }
  if (e.code === "Space"){ e.preventDefault(); spin(); }
  else if (e.key === "Enter"){ e.preventDefault(); check(); }
  else if (e.key.toLowerCase() === "j" && $("rate").classList.contains("show")) rate(true);
  else if (e.key.toLowerCase() === "n" && $("rate").classList.contains("show")) rate(false);
});
setMode("norep");
</script>
</body>
