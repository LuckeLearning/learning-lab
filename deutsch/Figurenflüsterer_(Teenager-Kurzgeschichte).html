<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Der Figurenflüsterer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,500;0,7..72,700;1,7..72,500&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700&display=swap">
<style>
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;min-height:100%}
[hidden]{display:none!important}
/* Layout: Akinator-Bühne – Schreibfeder links, Sprechblase mit Fragen rechts; Enthüllung als Fotokarte mit Banner "Ich sehe …" */
:root{
  --bg:#e6ebee; --bg2:#d3dde3; --card:#fbfcfc; --bubble:#ffffff;
  --ink:#15303f; --muted:#556a77; --line:#c4d0d7; --chip:#dae3e8;
  --band:#173f52; --band-fg:#f1f5f7; --btn:#173f52; --btn-hover:#205a73; --btn-fg:#ffffff;
  --gold:#b88732; --gold-soft:#efe4cc;
  --display:'Literata',Georgia,'Times New Roman',serif;
  --body:'Nunito Sans','Segoe UI',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1a21; --bg2:#14252e; --card:#172a34; --bubble:#1c3240;
  --ink:#e3ebf0; --muted:#9fb2be; --line:#2d4553; --chip:#203743;
  --band:#0c2c3b; --band-fg:#eef4f7; --btn:#2a6984; --btn-hover:#357e9e; --btn-fg:#ffffff;
  --gold:#e0b25c; --gold-soft:#3a3122; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0e1a21; --bg2:#14252e; --card:#172a34; --bubble:#1c3240;
  --ink:#e3ebf0; --muted:#9fb2be; --line:#2d4553; --chip:#203743;
  --band:#0c2c3b; --band-fg:#eef4f7; --btn:#2a6984; --btn-hover:#357e9e; --btn-fg:#ffffff;
  --gold:#e0b25c; --gold-soft:#3a3122; color-scheme:dark;}
body{background:var(--bg);background-image:radial-gradient(1200px 500px at 85% -10%,var(--bg2),transparent 70%),radial-gradient(900px 500px at -10% 110%,var(--bg2),transparent 70%);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55}
.app{max-width:1000px;margin:0 auto;padding-block:18px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{font-family:var(--display);font-weight:700;font-size:1.3rem}
.brand i{color:var(--gold)}
.chapters{display:flex;gap:6px;flex-wrap:wrap}
.chapters span{font-size:.72rem;font-weight:700;letter-spacing:.07em;text-transform:uppercase;padding:4px 10px;border-radius:999px;background:var(--chip);color:var(--muted)}
.chapters span.done{color:var(--ink)}
.chapters span.on{background:var(--band);color:var(--band-fg)}
.progress{height:5px;background:var(--chip);border-radius:6px;margin-top:14px;overflow:hidden}
.progress b{display:block;height:100%;background:var(--gold);border-radius:6px;transition:width .4s ease}

.stage{display:grid;grid-template-columns:minmax(160px,250px) minmax(0,1fr);gap:28px;align-items:center;margin-top:26px}
.genie svg{width:100%;height:auto;display:block}
.bubble{background:var(--bubble);border-radius:20px;padding:24px 26px;position:relative;box-shadow:0 10px 30px -18px rgba(10,40,60,.45);min-width:0}
.bubble::before{content:"";position:absolute;left:-14px;top:42px;border:14px solid transparent;border-right-color:var(--bubble);border-left:0}
.react{font-family:var(--display);font-style:italic;color:var(--gold);margin:0 0 4px;font-size:1rem;min-height:1.4em}
.q{font-family:var(--display);font-weight:700;font-size:clamp(1.25rem,2.6vw,1.65rem);line-height:1.3;margin:0;text-wrap:balance}
.hint{margin:8px 0 0;color:var(--muted);font-size:.92rem;max-width:62ch}
.lead{margin:12px 0 0;color:var(--muted);max-width:60ch}
.dots span{display:inline-block;animation:dot 1s infinite}
.dots span:nth-child(2){animation-delay:.15s}.dots span:nth-child(3){animation-delay:.3s}
@keyframes dot{0%,100%{transform:translateY(0);opacity:.4}50%{transform:translateY(-6px);opacity:1}}

.answers{display:grid;gap:10px;margin-top:20px}
.answers.two{grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.answers.yn{max-width:340px}
.ans{font:inherit;font-weight:700;font-size:1rem;background:var(--btn);color:var(--btn-fg);border:0;border-radius:12px;padding:11px 16px;text-align:left;cursor:pointer;display:flex;align-items:center;gap:12px;transition:transform .12s ease,background .12s ease}
.ans .t{display:flex;flex-direction:column;gap:1px;min-width:0}
.ans small{font-weight:600;font-size:.83rem;opacity:.8}
.ans:hover{background:var(--btn-hover);transform:translateX(3px)}
.ans:focus-visible,.pill:focus-visible,.link:focus-visible,.chipbtn:focus-visible,.thumb:focus-visible,.dice:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.ans.ghost{background:transparent;color:var(--ink);border:2px dashed var(--line)}
.ans.ghost:hover{background:var(--chip)}
.yn .ans{justify-content:center;text-align:center}
.sw{width:22px;height:22px;border-radius:50%;flex:none;border:2px solid rgba(255,255,255,.85);box-shadow:0 0 0 1px rgba(0,0,0,.25)}
.qfoot{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:18px;color:var(--muted);font-size:.9rem;flex-wrap:wrap}
.link{font:inherit;font-weight:700;background:none;border:0;color:var(--muted);cursor:pointer;padding:4px 0;text-decoration:underline;text-underline-offset:3px}
.link:hover{color:var(--ink)}
.pill{font:inherit;font-weight:700;font-size:1.02rem;background:var(--btn);color:var(--btn-fg);border:0;border-radius:10px;padding:10px 22px;min-width:150px;cursor:pointer;transition:background .12s}
.pill:hover{background:var(--btn-hover)}
.pill.gold{background:var(--gold);color:#241703}
.pill.gold:hover{filter:brightness(1.07)}
.pill.soft{background:var(--chip);color:var(--ink)}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}

.intro-grid{display:grid;grid-template-columns:minmax(0,1fr) 220px;gap:22px;align-items:start;margin-top:16px}
.example{background:var(--card);border-radius:14px;padding:10px;text-align:center}
.example svg{width:100%;height:auto;display:block;border-radius:8px}
.example p{margin:8px 0 2px;font-size:.84rem;color:var(--muted)}
.example b{font-family:var(--display);color:var(--ink);font-size:1rem;display:block}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px}
.tags span{font-size:.8rem;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--gold-soft);color:var(--ink)}

.reveal{background:var(--card);border-radius:20px;overflow:hidden;margin-top:24px;box-shadow:0 14px 40px -24px rgba(10,40,60,.5)}
.band{background:var(--band);color:var(--band-fg);text-align:center;font-family:var(--display);font-weight:700;font-size:1.3rem;letter-spacing:.12em;text-transform:uppercase;padding:12px 16px}
.who{padding:20px 20px 22px;text-align:center;display:grid;gap:6px;justify-items:center}
.namewrap{display:flex;align-items:center;gap:8px;justify-content:center;max-width:100%}
.name-in{font-family:var(--display);font-weight:700;font-size:clamp(1.5rem,4.2vw,2.1rem);color:var(--ink);background:transparent;border:0;border-bottom:2px dashed var(--line);text-align:center;width:min(100%,420px);padding:2px 4px}
.name-in:focus{outline:none;border-bottom-color:var(--gold)}
.dice{font:inherit;background:var(--chip);border:0;border-radius:10px;width:40px;height:40px;cursor:pointer;color:var(--ink);flex:none;display:grid;place-items:center}
.dice:hover{background:var(--line)}
.sub{color:var(--muted);font-size:1.02rem;margin:0}
.ask{font-family:var(--display);font-weight:700;margin:10px 0 2px}
.yn-row{display:flex;gap:18px;justify-content:center;align-items:center;flex-wrap:wrap}
.yn-row .diamond{width:9px;height:9px;background:var(--line);transform:rotate(45deg)}
.portrait{background:var(--bg2);padding:26px 16px;display:flex;flex-direction:column;align-items:center;gap:12px}
.portrait svg{width:min(100%,380px);height:auto;display:block;border-radius:6px;box-shadow:0 18px 30px -16px rgba(10,30,50,.55)}

.change{padding:20px;border-top:1px solid var(--line)}
.change h3,.sheet h3{font-family:var(--display);margin:0 0 12px;font-size:1.25rem}
.chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px}
.chipbtn{font:inherit;text-align:left;background:var(--chip);color:var(--ink);border:0;border-radius:10px;padding:8px 12px;cursor:pointer;display:flex;flex-direction:column}
.chipbtn small{font-size:.72rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:700}
.chipbtn:hover{background:var(--line)}

.sheet{padding:22px 20px 26px;border-top:1px solid var(--line);display:grid;gap:22px}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.box{background:var(--bg);border-radius:14px;padding:16px 18px;min-width:0}
.box h4{margin:0 0 8px;font-family:var(--display);font-size:1.05rem;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.box h4 span{font-size:.66rem;letter-spacing:.08em;text-transform:uppercase;background:var(--band);color:var(--band-fg);padding:2px 8px;border-radius:999px;font-family:var(--body)}
.box.key{background:var(--gold-soft)}
dl{margin:0;display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px}
dt{font-weight:700;color:var(--muted);font-size:.9rem}
dd{margin:0}
.plan{display:grid;gap:0;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.plan>div{display:grid;grid-template-columns:150px minmax(0,1fr);border-top:1px solid var(--line)}
.plan>div:first-child{border-top:0}
.plan b{background:var(--bg);padding:12px 14px;font-family:var(--display)}
.plan p{margin:0;padding:12px 14px}
.plan em{font-family:var(--display)}
@media (max-width:560px){.plan>div{grid-template-columns:1fr}}
.tip{border:2px dashed var(--line);border-radius:14px;padding:14px 18px}
.tip p{margin:4px 0}
.tip .bad{text-decoration:line-through;color:var(--muted)}
.toast{font-weight:700;color:var(--gold)}

.gallery{margin-top:30px}
.gallery h3{font-family:var(--display);margin:0 0 10px}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px}
.thumb{font:inherit;background:var(--card);border:0;border-radius:12px;padding:8px;cursor:pointer;color:var(--ink);text-align:center}
.thumb svg{width:100%;height:auto;display:block;border-radius:6px}
.thumb span{display:block;font-family:var(--display);font-weight:700;font-size:.9rem;margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.thumb:hover{outline:2px solid var(--line)}
textarea.copybox{width:100%;min-height:160px;font:inherit;font-size:.85rem;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:10px}

/* Feder */
.n-float{animation:float 5s ease-in-out infinite}
.n-eye{animation:blink 6s infinite;transform-box:fill-box;transform-origin:center}
.n-iris{transition:transform .35s ease}
[data-mood="think"] .n-iris{transform:translate(-3px,-3px)}
.n-happy{display:none}
[data-mood="happy"] .n-happy{display:inline}
[data-mood="happy"] .n-open{display:none}
.n-drop{opacity:0;transform-box:fill-box;transform-origin:50% 0}
[data-mood="think"] .n-drop{animation:drip 1.1s ease-in infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
@keyframes drip{0%{opacity:0;transform:scale(.3)}40%{opacity:1;transform:scale(1)}100%{opacity:0;transform:translateY(14px) scale(.9)}}
.pop{animation:pop .45s ease both}
@keyframes pop{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

@media (max-width:700px){
  .stage{grid-template-columns:1fr;gap:10px}
  .genie{max-width:130px;margin:0 auto}
  .bubble::before{left:50%;top:-14px;transform:translateX(-50%);border:14px solid transparent;border-bottom-color:var(--bubble);border-top:0}
  .intro-grid{grid-template-columns:1fr}
  .example{max-width:250px;margin:0 auto}
  .answers.yn{max-width:none}
}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">Der Figuren<i>flüsterer</i></div>
    <div class="chapters" id="chapters"></div>
  </header>
  <div class="progress" id="progress" hidden><b id="bar" style="width:0%"></b></div>
  <main id="view"></main>
  <section class="gallery" id="gallery" hidden></section>
</div>

<script>
/* ---------- Hilfsfunktionen ---------- */
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const pick=(arr,r=Math.random)=>arr[Math.floor(r()*arr.length)];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
const reduced=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
const h2r=h=>{const n=parseInt(h.slice(1),16);return[n>>16,n>>8&255,n&255]};
const r2h=a=>'#'+a.map(v=>Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,'0')).join('');
const mix=(a,b,t)=>{const A=h2r(a),B=h2r(b);return r2h(A.map((v,i)=>v+(B[i]-v)*t))};
const shade=(h,p)=>p<0?mix(h,'#000000',-p):mix(h,'#ffffff',p);
const F=n=>(+n).toFixed(1);

/* ---------- Daten ---------- */
const CHAPTERS=['Grundlagen','Äusseres','Inneres','Umfeld','Kurzgeschichte'];
const ROLLE=[
 {v:'held',l:'Hauptfigur',d:'Aus ihrer Sicht erlebt man die Geschichte'},
 {v:'gegner',l:'Gegenfigur',d:'Gerät mit der Hauptfigur in Konflikt, hat aber eigene Gründe'}];
const ALTER=[12,13,14,15,16].map(n=>({v:n,l:n+' Jahre'}));
const GESCHL=[{v:'m',l:'Männlich'},{v:'w',l:'Weiblich'},{v:'o',l:'Lieber offen lassen'}];
const ORTE=[
 {v:'schulhof',l:'Auf dem Schulhof',k:'Schulhof',p:'auf dem Schulhof'},
 {v:'klasse',l:'Im Klassenzimmer',k:'Klassenzimmer',p:'im Klassenzimmer'},
 {v:'kueche',l:'Zu Hause in der Küche',k:'Küche',p:'zu Hause in der Küche'},
 {v:'zimmer',l:'Im eigenen Zimmer',k:'eigenes Zimmer',p:'im eigenen Zimmer'},
 {v:'bus',l:'An der Bushaltestelle',k:'Bushaltestelle',p:'an der Bushaltestelle'},
 {v:'park',l:'Im Park',k:'Park',p:'im Park'},
 {v:'sport',l:'Auf dem Sportplatz',k:'Sportplatz',p:'auf dem Sportplatz'},
 {v:'bahnhof',l:'Am Bahnhof',k:'Bahnhof',p:'am Bahnhof'}];
const HAUT=[{v:'shell',l:'Sehr hell',c:'#f3d9c6'},{v:'hell',l:'Hell',c:'#e9bf9f'},{v:'mittel',l:'Mittel',c:'#cf9a6e'},{v:'braun',l:'Braun',c:'#a46b45'},{v:'dunkel',l:'Dunkelbraun',c:'#6c442c'}];
const FRISUR=[{v:'kurz',l:'Kurz'},{v:'lang',l:'Lang und offen'},{v:'locken',l:'Lockig'},{v:'zopf',l:'Pferdeschwanz'},{v:'dutt',l:'Dutt'},{v:'hoch',l:'Kurz und hochgestylt'},{v:'raspel',l:'Raspelkurz'}];
const HAAR=[{v:'blond',l:'Blond',c:'#d9b56b'},{v:'hellbraun',l:'Hellbraun',c:'#9a6a40'},{v:'braun',l:'Dunkelbraun',c:'#5a3a24'},{v:'schwarz',l:'Schwarz',c:'#241d1b'},{v:'rot',l:'Rot',c:'#b24f2c'},{v:'gefaerbt',l:'Türkis gefärbt',c:'#3f9e9b'}];
const KLEID=[{v:'hoodie',l:'Kapuzenpulli'},{v:'shirt',l:'T-Shirt'},{v:'hemd',l:'Hemd oder Bluse'},{v:'jeans',l:'Jeansjacke'},{v:'trainer',l:'Trainingsjacke'}];
const FARBE=[{v:'rot',l:'Rot',c:'#b8423a'},{v:'blau',l:'Dunkelblau',c:'#2f4f7f'},{v:'gruen',l:'Grün',c:'#4a7a55'},{v:'gelb',l:'Senfgelb',c:'#c99a2e'},{v:'grau',l:'Grau',c:'#8a8f96'},{v:'schwarz',l:'Schwarz',c:'#2a2c30'},{v:'weiss',l:'Weiss',c:'#ecebe7'}];
const KOPF=[{v:'nichts',l:'Nichts'},{v:'muetze',l:'Eine Wollmütze'},{v:'cap',l:'Ein Cap'},{v:'kapuze',l:'Die Kapuze',d:'tief ins Gesicht gezogen',need:'hoodie'},{v:'kopfhoerer',l:'Grosse Kopfhörer'}];
const MERKMAL=[{v:'sommersprossen',l:'Sommersprossen'},{v:'zahnspange',l:'Eine Zahnspange'},{v:'ohrstecker',l:'Ohrstecker'},{v:'pflaster',l:'Ein Pflaster im Gesicht'},{v:'narbe',l:'Eine kleine Narbe am Kinn'},{v:'keins',l:'Nichts Besonderes'}];
const CHAR=[
 {v:'selbst',l:'Selbstbewusst',stem:'selbstbewusst',desc:'tritt sicher auf und sagt offen die eigene Meinung',ex:n=>`${n} ging an der Gruppe vorbei, ohne den Blick zu senken.`},
 {v:'schuechtern',l:'Schüchtern',stem:'schüchtern',desc:'ist zurückhaltend und spricht nicht gern vor anderen',ex:n=>`${n} starrte auf die eigenen Schuhe und murmelte etwas, das niemand verstand.`},
 {v:'frech',l:'Frech',stem:'frech',desc:'hat immer einen Spruch auf Lager',ex:n=>`«Na und?», sagte ${n} und grinste, kaum hatte sich die Lehrerin umgedreht.`},
 {v:'nachdenklich',l:'Nachdenklich',stem:'nachdenklich',desc:'überlegt lange, bevor etwas gesagt wird',ex:n=>`${n} drehte den Stift zwischen den Fingern und sagte lange nichts.`},
 {v:'muerrisch',l:'Mürrisch',stem:'mürrisch',desc:'wirkt abweisend und lässt kaum jemanden an sich heran',ex:n=>`${n} knallte die Zimmertür zu, ohne ein Wort zu sagen.`},
 {v:'froehlich',l:'Fröhlich',stem:'fröhlich',desc:'lacht viel und steckt andere mit guter Laune an',ex:n=>`${n} lachte so laut, dass sich der halbe Bus umdrehte.`},
 {v:'vertraeumt',l:'Verträumt',stem:'verträumt',desc:'ist mit den Gedanken oft ganz woanders',ex:n=>`${n} hatte die Frage gar nicht gehört und sah den Regentropfen an der Scheibe nach.`}];
const EIG_ART=[{v:'fuehlen',l:'Im Fühlen',d:'wie die Figur Dinge empfindet'},{v:'denken',l:'Im Denken',d:'wie die Figur über sich und andere denkt'},{v:'handeln',l:'Im Handeln',d:'wie sich die Figur verhält'}];
const EIG={
 fuehlen:[{v:'gekraenkt',l:'Ist schnell gekränkt',desc:'ist schnell gekränkt, zeigt es aber nicht'},{v:'eifer',l:'Wird schnell eifersüchtig',desc:'wird schnell eifersüchtig'},{v:'scham',l:'Schämt sich schnell',desc:'schämt sich schnell für sich selbst'},{v:'mitfuehl',l:'Fühlt mit allen mit',desc:'spürt sofort, wenn es anderen schlecht geht'},{v:'wut',l:'Wird plötzlich wütend',desc:'wird plötzlich wütend, wenn etwas ungerecht ist'}],
 denken:[{v:'schlimm',l:'Malt sich das Schlimmste aus',desc:'malt sich immer das Schlimmste aus'},{v:'gut',l:'Glaubt, nicht gut genug zu sein',desc:'glaubt, nicht gut genug zu sein'},{v:'reden',l:'Denkt, alle reden über sie',desc:'denkt, dass alle hinter dem Rücken reden'},{v:'schlau',l:'Hält sich für schlauer als andere',desc:'hält sich für schlauer als die anderen'},{v:'misstrau',l:'Misstraut allen',desc:'traut niemandem so richtig'}],
 handeln:[{v:'weg',l:'Läuft weg, wenn es schwierig wird',desc:'läuft weg, wenn es schwierig wird'},{v:'luegen',l:'Lügt, um Ärger zu vermeiden',desc:'lügt, um Ärger zu vermeiden'},{v:'nein',l:'Kann nicht Nein sagen',desc:'kann einfach nicht Nein sagen'},{v:'witz',l:'Macht Witze, wenn es ernst wird',desc:'macht Witze, sobald es ernst wird'},{v:'allein',l:'Will alles allein schaffen',desc:'will alles allein schaffen und nimmt keine Hilfe an'}]};

function scene(name,r){
 const W=300,H=380;let s='';
 const R=(x,y,w,h,f,ex='')=>`<rect x="${F(x)}" y="${F(y)}" width="${F(w)}" height="${F(h)}" fill="${f}" ${ex}/>`;
 const bokeh=(n,cols,y0=0,y1=H)=>{let b='';for(let i=0;i<n;i++)b+=`<circle cx="${F(r()*W)}" cy="${F(y0+r()*(y1-y0))}" r="${F(5+r()*16)}" fill="${pick(cols,r)}" opacity="${(.15+r()*.3).toFixed(2)}"/>`;return b};
 switch(name){
  case 'schulhof':s+=R(0,0,W,H,'#c8d4dc')+R(-10,50,320,230,'#d8c9ae');for(let y=70;y<250;y+=46)for(let x=6;x<300;x+=40)s+=R(x,y,26,30,'#7c8c98');s+=`<circle cx="20" cy="190" r="60" fill="#748f5e"/><circle cx="290" cy="170" r="70" fill="#6a8656"/>`+R(0,270,W,H,'#8b8e90')+bokeh(10,['#ffffff']);break;
  case 'klasse':s+=R(0,0,W,H,'#e6dfcf')+R(20,70,230,130,'#2f4c42')+R(20,198,230,8,'#b9a98c')+R(256,40,60,200,'#f6f3e6')+R(0,0,W,24,'#f2efe6')+R(60,8,70,8,'#fffbe9')+R(170,8,70,8,'#fffbe9')+R(0,280,W,H,'#b7a587')+bokeh(6,['#fffbe9'],0,80);break;
  case 'kueche':s+=R(0,0,W,H,'#efeeea');for(let y=110;y<240;y+=18)for(let x=0;x<W;x+=18)s+=R(x,y,17,17,'#e3e6e5');s+=R(0,0,W,100,'#c9b89c')+R(0,240,W,140,'#bba98c')+R(200,20,90,120,'#fbf6e3')+R(10,150,50,200,'#d9dcdc')+bokeh(8,['#fff6d8'],0,160);break;
  case 'zimmer':s+=R(0,0,W,H,'#9fb2c1')+R(18,40,70,96,'#c8573f')+R(100,30,60,80,'#e9d38a')+R(230,30,64,150,'#f4f0e1')+R(10,200,110,10,'#7d6248');for(let x=14;x<116;x+=9)s+=R(x,172,7,28,pick(['#b8423a','#2f4f7f','#4a7a55','#c99a2e','#e3ddd0'],r));s+=`<circle cx="190" cy="170" r="40" fill="#ffd894" opacity=".55"/>`+R(0,290,W,H,'#6f6a66')+bokeh(6,['#ffe2a8'],120,220);break;
  case 'bus':s+=R(0,0,W,H,'#b9c5cd')+R(0,230,W,H,'#6f7377')+R(190,60,120,200,'#cfc23e')+R(196,80,104,50,'#3b4a55')+R(20,40,8,240,'#5a5f63')+R(20,40,140,6,'#5a5f63')+R(30,60,120,170,'#dfe8ec','opacity=".5"')+bokeh(14,['#ffffff','#ffe9a8','#ff9e7a']);break;
  case 'park':s+=R(0,0,W,H,'#8aa665');for(let i=0;i<16;i++)s+=`<circle cx="${F(r()*W)}" cy="${F(r()*260)}" r="${F(30+r()*50)}" fill="${pick(['#a9c47a','#6b8a4c','#58773f','#c1d78f'],r)}"/>`;s+=R(0,280,W,H,'#9a8e6c')+bokeh(18,['#ffffff','#f4f7d0']);break;
  case 'sport':s+=R(0,0,W,H,'#bcd2e2')+R(0,190,W,H,'#5f9a55');for(let x=0;x<W;x+=14)s+=R(x,120,2,80,'#6a7177');s+=R(0,120,W,2,'#6a7177')+R(0,160,W,2,'#6a7177')+`<circle cx="40" cy="40" r="14" fill="#ffffff"/><circle cx="70" cy="40" r="14" fill="#ffffff"/>`+bokeh(8,['#ffffff']);break;
  case 'bahnhof':s+=R(0,0,W,H,'#a7adb2')+R(0,0,W,50,'#4a5056')+R(0,180,W,60,'#b23a30')+R(10,190,60,30,'#2e3a44')+R(90,190,60,30,'#2e3a44')+R(170,190,60,30,'#2e3a44')+R(0,250,W,H,'#8d8f90')+bokeh(14,['#ffffff','#ffe7a6'],0,120);break;

 }

 /* Kopfbedeckung */
 const hatC=f.color==='weiss'?'#cfcac0':f.color==='schwarz'?'#3a3d42':shade(cloth,-.05);
 if(f.hat==='muetze'){let rib='';for(let x=cx-fw-12;x<cx+fw+14;x+=6)rib+=`<path d="M${x},${cy-44} v-60" stroke="#000" stroke-width="1" opacity=".1"/>`;const dome=`M${cx-fw-8},${cy-30} C${cx-fw-12},${top-50} ${cx+fw+24},${top-60} ${cx+fw+8},${cy-30}Z`;L+=`<clipPath id="${id('mz')}"><path d="${dome}"/></clipPath><path d="${dome}" fill="${hatC}"/><path d="${dome}" fill="url(#${id('side')})"/><g clip-path="url(#${id('mz')})">${rib}</g><path d="M${cx-fw-10},${cy-46} Q${cx},${cy-54} ${cx+fw+10},${cy-46} L${cx+fw+11},${cy-26} Q${cx},${cy-34} ${cx-fw-11},${cy-26}Z" fill="${shade(hatC,-.15)}"/>`}
 if(f.hat==='cap')L+=`<path d="M${cx-fw-4},${cy-34} C${cx-fw-2},${top-36} ${cx+fw+2},${top-36} ${cx+fw+4},${cy-34}Z" fill="${hatC}"/><path d="M${cx},${top-28} V${cy-34}" stroke="#000" stroke-width="1" opacity=".2"/><path d="M${cx-fw-6},${cy-34} Q${cx},${cy-16} ${cx+fw+6},${cy-34} Q${cx},${cy-44} ${cx-fw-6},${cy-34}Z" fill="${shade(hatC,-.2)}"/><rect x="${cx-70}" y="${top-40}" width="140" height="110" fill="url(#${id('side')})" clip-path="none" opacity=".0"/>`;
 if(hood)L+=`<path d="M${cx-fw-10},${cy+52} C${cx-fw-18},${top-6} ${cx+fw+18},${top-6} ${cx+fw+10},${cy+52}" stroke="${shade(cloth,-.08)}" stroke-width="14" fill="none" stroke-linecap="round"/><path d="M${cx-fw-4},${cy+50} C${cx-fw-10},${top+2} ${cx+fw+10},${top+2} ${cx+fw+4},${cy+50}" stroke="#000" stroke-width="4" fill="none" opacity=".2" filter="url(#${id('s1')})"/>`;
 if(f.hat==='kopfhoerer')L+=`<path d="M${cx-fw-6},${ey+2} C${cx-fw-10},${top-36} ${cx+fw+10},${top-36} ${cx+fw+6},${ey+2}" stroke="#1f2226" stroke-width="8" fill="none"/><rect x="${cx-fw-14}" y="${ey-6}" width="18" height="32" rx="8" fill="#2a2e33"/><rect x="${cx+fw-4}" y="${ey-6}" width="18" height="32" rx="8" fill="#2a2e33"/><rect x="${cx-fw-11}" y="${ey-2}" width="4" height="20" rx="2" fill="#5a6068"/>`;

 /* Brille */
 if(f.glasses){const gw=15,gh=10.5;L+=`<rect x="${exL-gw}" y="${ey-gh}" width="${gw*2}" height="${gh*2}" rx="8" fill="#ffffff" fill-opacity=".07" stroke="#1d1d1f" stroke-width="2.2"/><rect x="${exR-gw}" y="${ey-gh}" width="${gw*2}" height="${gh*2}" rx="8" fill="#ffffff" fill-opacity=".07" stroke="#1d1d1f" stroke-width="2.2"/><path d="M${exL+gw},${ey-2} Q${cx},${ey-6} ${exR-gw},${ey-2} M${exL-gw},${ey-4} L${cx-fw+1},${ey-2} M${exR+gw},${ey-4} L${cx+fw-1},${ey-2}" stroke="#1d1d1f" stroke-width="2.2" fill="none"/><path d="M${exL-8},${ey+6} L${exL+2},${ey-8} M${exR-8},${ey+6} L${exR+2},${ey-8}" stroke="#fff" stroke-width="1.6" opacity=".35"/>`}

 /* Licht, Vignette, Korn */
 L+=`<rect width="300" height="380" fill="url(#${id('vg')})"/><rect width="300" height="380" fill="#ffb27a" opacity=".05"/><rect width="300" height="380" filter="url(#${id('gr')})" style="mix-blend-mode:overlay"/>`;

 return `<svg viewBox="0 0 300 380" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Porträt der Figur"><defs>${defs}</defs><g clip-path="url(#${id('fr')})">${L}</g></svg>`;
}

/* ---------- Ansichten ---------- */
const view=document.getElementById('view');
function setChapters(cur){
 const el=document.getElementById('chapters');
 if(cur==null){el.innerHTML='';document.getElementById('progress').hidden=true;return}
 const doneCh=i=>Q.filter(q=>q.ch===i&&shown(q)).every(valid);
 el.innerHTML=CHAPTERS.map((c,i)=>`<span class="${i===cur?'on':doneCh(i)?'done':''}">${c}</span>`).join('');
 const tot=Q.filter(shown).length,dn=Q.filter(q=>shown(q)&&valid(q)).length;
 document.getElementById('progress').hidden=false;document.getElementById('bar').style.width=(cur===5?100:Math.round(dn/tot*100))+'%';
}

const EXAMPLE={ort:'park',alter:15,geschlecht:'m',haut:'hell',frisur:'lang',haarfarbe:'braun',brille:false,merkmal:'keins',kleidung:'hemd',farbe:'grau',kopf:'muetze',charakter:'selbst'};

function showStart(){
 setChapters(null);
 view.innerHTML=`<div class="stage pop">
  <div class="genie">${guideSVG('talk')}</div>
  <div class="bubble">
   <p class="react">Willkommen.</p>
   <h1 class="q">Jede Kurzgeschichte beginnt mit einer Figur. Ich helfe dir, deine zu finden.</h1>
   <div class="intro-grid">
    <div>
     <p class="lead" style="margin-top:0">Ich stelle dir Fragen, wie bei einem Ratespiel. Mit jeder Antwort wird deine Figur genauer: ein Mensch zwischen 12 und 16 Jahren, mitten im Alltag. Am Schluss siehst du ein Porträt und bekommst einen Steckbrief und einen Plan für deine Kurzgeschichte.</p>
     <div class="tags"><span>Äusseres</span><span>Eigenheit</span><span>Umfeld &amp; Sprache</span><span>Moment &amp; Wendepunkt</span></div>
     <div class="row" style="margin-top:22px"><button class="pill gold" id="go">Figur erfinden</button>${S.saved.length?`<span style="color:var(--muted);font-size:.9rem">${S.saved.length} Figur${S.saved.length>1?'en':''} gespeichert</span>`:''}</div>
    </div>
    <div class="example">${drawFigure(figFrom(EXAMPLE,7),'ex')}<p>Beispiel<b>Levin Marxer</b>Selbstbewusste Hauptfigur · 15 Jahre</p></div>
   </div>
  </div></div>`;
 document.getElementById('go').onclick=newFigure;
 renderGallery();
}

function newFigure(){Object.assign(S,{a:{},stack:[],name:'',nameAuto:true,nameKey:'',seed:Math.floor(Math.random()*1e9),currentId:null,confirmed:false,changing:false});advance()}
function advance(){const q=nextQ();if(!q)showResult();else showQuestion(q)}

function showQuestion(q,reaction){
 const ch=q.ch;setChapters(ch);
 const text=typeof q.t==='function'?q.t(S.a):q.t;
 const tot=Q.filter(shown).length,num=Q.filter(x=>shown(x)&&valid(x)).length+1;
 let btns='';
 if(q.type==='yesno'){
  btns=`<div class="answers yn">${[['Ja','y'],['Nein','n'],['Weiss nicht','?'],['Wahrscheinlich','y'],['Eher nicht','n']].map(([l,v])=>`<button class="ans" data-yn="${v}">${l}</button>`).join('')}</div>`;
 }else{
  const opts=q.opts(S.a);
  btns=`<div class="answers ${q.two&&opts.length>3?'two':''}">${opts.map((o,i)=>`<button class="ans" data-i="${i}">${o.c?`<span class="sw" style="background:${o.c}"></span>`:''}<span class="t">${o.l}${o.d?`<small>${o.d}</small>`:''}</span></button>`).join('')}<button class="ans ghost" data-i="?"><span class="t">Weiss nicht – entscheide du!</span></button></div>`;
 }
 view.innerHTML=`<div class="stage">
  <div class="genie">${guideSVG('talk')}</div>
  <div class="bubble pop">
   <p class="react">${reaction||''}</p>
   <h2 class="q">${esc(text)}</h2>
   ${q.h?`<p class="hint">${esc(q.h)}</p>`:''}
   ${btns}
   <div class="qfoot"><button class="link" id="back">${S.changing?'Abbrechen':S.stack.length?'← Zurück':'← Zum Start'}</button><span>Frage ${num} von ${tot}</span></div>
  </div></div>`;
 view.querySelectorAll('.ans').forEach(b=>b.onclick=()=>{
  let v;
  if(q.type==='yesno'){const y=b.dataset.yn;v=y==='y'?true:y==='n'?false:Math.random()<.5}
  else{const opts=q.opts(S.a);v=b.dataset.i==='?'?pick(opts).v:opts[+b.dataset.i].v}
  answer(q,v);
 });
 document.getElementById('back').onclick=()=>{
  if(S.changing){S.changing=false;if(S._prev!==undefined&&S.a[q.id]===undefined)S.a[q.id]=S._prev;advance();return}
  const id=S.stack.pop();if(!id){showStart();return}delete S.a[id];showQuestion(qById(id));
 };
 renderGallery(true);
}

function answer(q,v){
 S.a[q.id]=v;S.stack.push(q.id);
 view.querySelectorAll('.ans').forEach(b=>b.disabled=true);
 mood('think');
 const bub=view.querySelector('.bubble .q');if(bub)bub.innerHTML='<span class="dots"><span>.</span><span>.</span><span>.</span></span>';
 view.querySelectorAll('.react,.hint').forEach(e=>e.textContent='');
 setTimeout(()=>{const n=nextQ();if(!n){S.changing=false;showResult()}else showQuestion(n,Math.random()<.5?pick(REACT):'')},reduced?120:650);
}

/* ---------- Ergebnis ---------- */
function ensureName(){const key=S.a.geschlecht;if(S.nameAuto&&S.nameKey!==key){S.name=makeName(S.a);S.nameKey=key}}
function rolleTitle(a){const stem=find(CHAR,a.charakter).stem||'';
 if(a.rolle==='gegner')return cap(stem)+(a.geschlecht==='m'?'er Gegenspieler':a.geschlecht==='w'?'e Gegenspielerin':'e Gegenfigur');
 return cap(stem)+'e '+(a.rolle==='held'?'Hauptfigur':'Nebenfigur')}
const subtitle=a=>`${rolleTitle(a)} · ${a.alter} Jahre · ${find(ORTE,a.ort).k}`;

function showResult(){
 ensureName();setChapters(5);
 const a=S.a;
 view.innerHTML=`<div class="reveal pop">
  <div class="band">Ich sehe …</div>
  <div class="who">
   <div class="namewrap"><input class="name-in" id="nm" value="${esc(S.name)}" aria-label="Name der Figur" maxlength="40"><button class="dice" id="dice" title="Anderen Namen vorschlagen" aria-label="Anderen Namen vorschlagen"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="4"/><circle cx="8" cy="8" r="1.3" fill="currentColor"/><circle cx="16" cy="16" r="1.3" fill="currentColor"/><circle cx="12" cy="12" r="1.3" fill="currentColor"/><circle cx="16" cy="8" r="1.3" fill="currentColor"/><circle cx="8" cy="16" r="1.3" fill="currentColor"/></svg></button></div>
   <p class="sub">${esc(subtitle(a))}</p>
   <p class="ask">${S.confirmed?'Das ist deine Figur.':'Ist das deine Figur?'}</p>
   ${S.confirmed?'':`<div class="yn-row"><button class="pill" id="yes">Ja</button><span class="diamond"></span><button class="pill" id="no">Nein</button></div>`}
  </div>
  <div class="portrait"><div id="pic">${drawFigure(figFrom(a,S.seed),'main')}</div><button class="link" id="redraw">Anderes Foto</button></div>
  <div id="extra"></div>
 </div>`;
 const nm=document.getElementById('nm');
 nm.oninput=()=>{S.name=nm.value.trim()||'Namenlos';S.nameAuto=false;if(S.confirmed){saveCurrent();renderSheet()}};
 document.getElementById('dice').onclick=()=>{S.name=makeName(a);S.nameAuto=true;nm.value=S.name;if(S.confirmed){saveCurrent();renderSheet()}};
 document.getElementById('redraw').onclick=()=>{S.seed=Math.floor(Math.random()*1e9);document.getElementById('pic').innerHTML=drawFigure(figFrom(a,S.seed),'main');if(S.confirmed)saveCurrent()};
 if(!S.confirmed){
  mood('happy');
  document.getElementById('yes').onclick=()=>{S.confirmed=true;saveCurrent();showResult()};
  document.getElementById('no').onclick=showChange;
 }else renderSheet();
 renderGallery();
}

function showChange(){
 const ex=document.getElementById('extra');
 const list=Q.filter(q=>shown(q)&&valid(q));
 ex.innerHTML=`<div class="change pop"><h3>Was soll ich ändern?</h3><div class="chips">${list.map(q=>`<button class="chipbtn" data-id="${q.id}"><small>${q.k}</small>${esc(ansLabel(q))}</button>`).join('')}</div></div>`;
 ex.querySelectorAll('.chipbtn').forEach(b=>b.onclick=()=>{const id=b.dataset.id;S._prev=S.a[id];delete S.a[id];S.changing=true;S.confirmed=false;showQuestion(qById(id),'Gut, das ändern wir.')});
 ex.scrollIntoView({behavior:reduced?'auto':'smooth',block:'start'});
}

function sheetData(){
 const a=S.a,n=S.name;
 const pron=a.geschlecht==='m'?'er':a.geschlecht==='w'?'sie':n;
 const ch=find(CHAR,a.charakter),eg=find(EIG[a.eigArt]||[],a.eigenheit),st=find(STAERKE,a.staerke),sp=find(SPRACHE,a.sprache),si=find(SITUATION,a.situation),wu=find(WUNSCH,a.wunsch),au=find(AUSSAGE,a.aussage),gg=find(GEGEN,a.gegenstand),ort=find(ORTE,a.ort),um=find(UMFELD,a.umfeld);
 const gh=a.geheimnis?find(GEHEIM,a.geheimnisWas):null;
 const hair=`${find(FRISUR,a.frisur).l}, ${find(HAAR,a.haarfarbe).l.toLowerCase()}`;
 const extras=[a.brille?'Brille':null,a.merkmal!=='keins'?find(MERKMAL,a.merkmal).l.replace(/^(Eine?n?) /,''):null,a.kopf!=='nichts'?find(KOPF,a.kopf).l.replace(/^(Eine?n?|Die|Grosse) /,''):null].filter(Boolean);
 const groups=[
  {t:'Grundlagen',tag:'Wer?',rows:[['Rolle',find(ROLLE,a.rolle).l],['Alter',a.alter+' Jahre'],['Geschlecht',find(GESCHL,a.geschlecht).l.replace('Lieber offen lassen','offen')],['Erster Auftritt',ort.l]]},
  {t:'Äussere Merkmale',tag:'Aussehen',rows:[['Haare',hair],['Haut',find(HAUT,a.haut).l],['Kleidung',`${find(KLEID,a.kleidung).l}, ${find(FARBE,a.farbe).l.toLowerCase()}`],['Auffällig',extras.length?extras.join(', '):'nichts']]},
  {t:'Innere Merkmale',tag:'Charakter',rows:[['Wirkt',`${ch.l.toLowerCase()} – ${ch.desc}`],['Stärke',st.desc]]},
  {t:'Die besondere Eigenheit',tag:find(EIG_ART,a.eigArt).l,key:1,rows:[['Eigenheit',eg.desc]]},
  {t:'Umfeld & Sprache',tag:'Beziehungen',rows:[['Zuhause',um.l],['Freundschaft',a.freund?'hat eine beste Freundin oder einen besten Freund':'hat keine beste Freundin und keinen besten Freund'],['Typischer Satz',`«${sp.ex}»`]]},
  {t:'Im Moment der Geschichte',tag:'Handlung',rows:[['Situation',si.desc],['Wunsch',wu.desc],['Geheimnis',gh?gh.desc:'keines – oder doch?'],['Immer dabei',gg.l]]}
 ];
 const plan=[
  ['Kürze',`Erzähle nur einen Moment: ${n} ${si.desc}. Keine ganze Lebensgeschichte, nur dieser Ausschnitt.`],
  ['Offenheit',`Beginne mitten im Geschehen, ohne Einleitung. Zum Beispiel: <em>${esc(si.start(n))}</em><br>Lass den Schluss offen: Verrate nicht, ob ${pron} am Ende bekommt, was ${a.geschlecht==='o'?n:pron} sich wünscht.`],
  ['Alltäglichkeit',`Ort: ${ort.l}. ${n} ist ${a.geschlecht==='w'?'keine Heldin':'kein Held'}, sondern ein ganz normaler Mensch. Lass ${pron==='er'?'ihn':pron==='sie'?'sie':n} so reden wie im echten Leben: «${esc(sp.ex)}»`],
  ['Figuren',`Höchstens zwei oder drei Figuren. Beschreibe ${n} nur knapp. Am wichtigsten ist die Eigenheit: ${n} ${eg.desc}.`],
  ['Aufbau',`Erzähle der Reihe nach und steigere die Spannung bis zum Wendepunkt gegen Schluss: ${n} ${au.desc}.${gh?` Das Geheimnis kann dabei eine Rolle spielen: ${n} ${gh.desc}.`:''}`],
  ['Aussage',`${au.q} Der Leser soll am Ende über etwas nachdenken, das grösser ist als die Geschichte selbst.`]
 ];
 return{groups,plan,ch};
}

function renderSheet(){
 const d=sheetData(),n=S.name;
 const ex=document.getElementById('extra');
 ex.innerHTML=`<div class="sheet pop">
  <h3>Steckbrief von ${esc(n)}</h3>
  <div class="cols">${d.groups.map(g=>`<div class="box${g.key?' key':''}"><h4>${g.t} <span>${esc(g.tag)}</span></h4><dl>${g.rows.map(([k,v])=>`<dt>${k}</dt><dd>${esc(v)}</dd>`).join('')}</dl></div>`).join('')}</div>
  <div><h3>Plan für deine Kurzgeschichte</h3>
   <div class="plan">${d.plan.map(([k,v])=>`<div><b>${k}</b><p>${v.replace(/«([^»]*)»/g,(m)=>m)}</p></div>`).join('')}</div></div>
  <div class="tip"><h3 style="margin:0 0 4px">Zeigen statt sagen</h3>
   <p>Nenne die Eigenschaften deiner Figur nicht direkt. Zeig sie durch das, was die Figur tut oder sagt (indirekte Charakterisierung).</p>
   <p class="bad">${esc(n)} ist ${esc(d.ch.l.toLowerCase())}.</p>
   <p><b>Besser:</b> ${esc(d.ch.ex(n))}</p></div>
  <div class="row"><button class="pill" id="copy">Steckbrief kopieren</button><button class="pill soft" id="chg">Etwas ändern</button><button class="pill gold" id="new">Nächste Figur erfinden</button><span class="toast" id="toast" aria-live="polite"></span></div>
  <div id="copyfb"></div>
 </div>`;
 document.getElementById('new').onclick=newFigure;
 document.getElementById('chg').onclick=()=>{S.confirmed=false;showResult();showChange()};
 document.getElementById('copy').onclick=()=>{
  const strip=s=>s.replace(/<br>/g,'\n   ').replace(/<[^>]+>/g,'');
  const txt=`STECKBRIEF: ${n}\n${subtitle(S.a)}\n\n`+d.groups.map(g=>g.t.toUpperCase()+'\n'+g.rows.map(([k,v])=>`- ${k}: ${v}`).join('\n')).join('\n\n')+'\n\nPLAN FÜR DIE KURZGESCHICHTE\n'+d.plan.map(([k,v])=>`${k}: ${strip(v)}`).join('\n');
  const t=document.getElementById('toast');
  const fb=()=>{document.getElementById('copyfb').innerHTML=`<textarea class="copybox" id="cb" readonly>${esc(txt)}</textarea>`;const cb=document.getElementById('cb');cb.focus();cb.select();t.textContent='Text markiert – jetzt mit Strg+C kopieren.'};
  try{navigator.clipboard.writeText(txt).then(()=>{t.textContent='Kopiert!'},fb)}catch(e){fb()}
 };
}

/* ---------- Galerie ---------- */
function saveCurrent(){
 const rec={id:S.currentId||('f'+Date.now()),name:S.name,a:{...S.a},seed:S.seed};
 S.currentId=rec.id;const i=S.saved.findIndex(x=>x.id===rec.id);
 if(i>=0)S.saved[i]=rec;else S.saved.push(rec);persist();
}
function openSaved(id){const r=S.saved.find(x=>x.id===id);if(!r)return;Object.assign(S,{a:{...r.a},name:r.name,nameAuto:false,nameKey:r.a.geschlecht,seed:r.seed,currentId:r.id,confirmed:true,changing:false});S.stack=Q.filter(q=>shown(q)&&valid(q)).map(q=>q.id);showResult();window.scrollTo({top:0,behavior:reduced?'auto':'smooth'})}
function renderGallery(hide){
 const g=document.getElementById('gallery');
 if(hide||!S.saved.length){g.hidden=true;return}
 g.hidden=false;
 g.innerHTML=`<h3>Figuren für deine Kurzgeschichte</h3><div class="thumbs">${S.saved.map(r=>`<button class="thumb" data-id="${r.id}">${drawFigure(figFrom(r.a,r.seed),'t'+r.id)}<span>${esc(r.name)}</span></button>`).join('')}</div>`;
 g.querySelectorAll('.thumb').forEach(b=>b.onclick=()=>openSaved(b.dataset.id));
}

showStart();
</script>
</body>
</html>
