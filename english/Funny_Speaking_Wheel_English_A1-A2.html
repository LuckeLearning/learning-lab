<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Funny Speaking Wheel – A1–A2</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:Georgia,"Times New Roman",serif;background:#201e1d;color:#201e1d;overflow:hidden}body{display:flex;align-items:center;justify-content:center}.stage{width:1920px;height:1080px;transform-origin:center center;flex:none;padding:64px 84px;display:flex;align-items:center;gap:70px;background:radial-gradient(#d7d3d3 2px,transparent 2.1px) 0 0/18px 18px,#f3f2f2}.left{flex:0 0 800px;display:flex;flex-direction:column;align-items:center;gap:30px}.wheelbox{position:relative;width:740px;height:740px}.wheel{width:100%;height:100%;border-radius:50%;transition:transform 4.6s cubic-bezier(.14,.85,.16,1);filter:drop-shadow(0 8px 0 #201e1d)}.pointer{position:absolute;top:-18px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:25px solid transparent;border-right:25px solid transparent;border-top:48px solid #201e1d;z-index:5}.hub{position:absolute;inset:50% auto auto 50%;width:19%;height:19%;transform:translate(-50%,-50%);background:#f3f2f2;border:5px solid #201e1d;border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:42px}.spin{width:620px;font:900 56px Georgia,serif;text-transform:uppercase;color:#fff1f4;background:#d6006c;border:0;padding:22px 30px;cursor:pointer;box-shadow:12px 12px 0 #201e1d}.spin:active{box-shadow:4px 4px 0 #201e1d;transform:translate(8px,8px)}.spin:disabled{opacity:.65;cursor:default}.right{flex:1;min-width:0}.badges{display:flex;gap:14px;align-items:center}.badge{color:#fff;font-size:26px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;padding:10px 18px}.pink{background:#d6006c;transform:rotate(-2.5deg)}.black{background:#201e1d;transform:rotate(1.5deg)}h1{margin:34px 0 24px;font-size:116px;line-height:.84;letter-spacing:-.04em;font-weight:900}.accent{display:block;color:#d6006c;-webkit-text-stroke:3px #201e1d}.intro p{margin:0;font-size:40px;line-height:1.3;max-width:25ch;font-weight:600}.card{display:none;background:#f8f4f4;border:5px solid #201e1d;box-shadow:16px 16px 0 #d6006c;padding:44px 50px;flex-direction:column;gap:24px;animation:pop .35s ease}.card.show{display:flex}@keyframes pop{from{opacity:0;transform:translateY(16px) rotate(-1deg)}to{opacity:1;transform:none}}.topicline{display:flex;align-items:center;gap:22px}.yourtopic{background:#edbb00;font-size:24px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;padding:9px 16px;transform:rotate(-1.5deg)}.number{font-size:30px;font-weight:900;letter-spacing:.1em;color:#605d5d}.card h2{margin:0;font-size:78px;line-height:.96;letter-spacing:-.025em}.question{margin:0;font-size:39px;line-height:1.34}.rule{height:5px;background:#201e1d}.timerrow{display:flex;align-items:center;justify-content:space-between;gap:24px}.clock{font-weight:900;font-size:104px;line-height:.86;letter-spacing:-.03em}.times{display:flex;gap:10px;align-items:center}.times button{font:900 28px Georgia,serif;width:62px;height:62px;border:3px solid #201e1d;background:transparent;cursor:pointer}.times button.active{background:#201e1d;color:#f8f4f4}.times span{font-size:26px;font-weight:600;color:#605d5d}.actions{display:flex;gap:14px}.actions button{font:700 30px Georgia,serif;padding:16px 40px;cursor:pointer}.start{color:#f8f4f4;background:#0088b0;border:0}.reset{color:#201e1d;background:transparent;border:3px solid #201e1d}
</style>
</head>
<body>
<main class="stage" id="stage">
 <section class="left">
  <div class="wheelbox"><canvas class="wheel" id="wheel" width="900" height="900" role="button" tabindex="0" aria-label="Spin the wheel" style="cursor:pointer;touch-action:manipulation"></canvas><div class="hub">12</div><div class="pointer"></div></div>
  <button class="spin" id="spin" type="button">Spin the wheel</button>
 </section>
 <section class="right">
  <div class="intro" id="intro"><div class="badges"><span class="badge pink">12 funny topics</span><span class="badge black">One spin</span></div><h1>LET'S TALK<br><span class="accent">AND LAUGH</span></h1><p>Find a partner · spin the wheel · give a funny answer</p></div>
  <div class="card" id="card" style="gap:18px;padding:34px 42px"><div class="topicline"><span class="yourtopic">Your topic</span><span class="number" id="number"></span></div><h2 id="title"></h2><p class="question" id="question"></p><div style="background:#e9f4f7;border-left:8px solid #0088b0;padding:18px 22px"><div style="font-size:23px;font-weight:900;letter-spacing:.13em;text-transform:uppercase;color:#006786;margin-bottom:10px">Key phrases – use at least three</div><div id="phrases" style="display:grid;grid-template-columns:1fr 1fr;gap:8px 24px;font-size:25px;line-height:1.25;font-weight:600"></div><div style="border-top:2px solid #8fc5d3;margin-top:13px;padding-top:10px;font-size:22px"><strong>Speaking challenge:</strong> Give a reason with <em>because</em> · Ask: <em>What about you?</em> · React: <em>Really?</em> / <em>Me too!</em> / <em>I don't agree.</em></div></div><div class="rule"></div><div class="timerrow"><div class="clock" id="clock">02:00</div><div class="times"><button data-sec="60">1</button><button class="active" data-sec="120">2</button><button data-sec="180">3</button><span>min</span></div></div><div class="actions"><button class="start" id="start">Start</button><button class="reset" id="reset">Reset</button></div></div>
 </section>
</main>
<script>
const stage=document.getElementById('stage');
function fitStage(){const margin=20;const scale=Math.min((window.innerWidth-margin)/1920,(window.innerHeight-margin)/1080);stage.style.transform='scale('+Math.max(scale,0.1)+')'}
fitStage();window.addEventListener('resize',fitStage);
const topics=[
 {t:'Animal teacher',q:'An animal is your new English teacher. Which animal is it, and what does it do in class?',k:['I think a … would be funny.','It always / never …','The lessons are … because …','What animal would you choose?']},
 {t:'Strange sandwich',q:'Invent the strangest sandwich in the world. What is in it, and what does it taste like?',k:['In my opinion, it needs …','There is / are … in it.','I would not eat it because …','Would you try it?']},
 {t:'Funny superpower',q:'Choose a completely useless superpower. What can you do with it?',k:['I would like to be able to …','I can …, but I cannot …','It is useless because …','What about you?']},
 {t:'Talking object',q:'One object in your school bag can talk. Which one is it, and what does it say?',k:['I think my … can talk.','It says, “…”','That is funny because …','Can you imagine that?']},
 {t:'Alien visitor',q:'An alien comes to your home for dinner. What do you give it, and what happens?',k:['First, I give it …','I think it likes / hates …','Then, it … because …','What would you give it?']},
 {t:'Ridiculous rule',q:'Invent a funny new rule for your school. What must everyone do?',k:['I think everyone must …','Nobody can …','It is a good / bad rule because …','Do you agree?']},
 {t:'Tiny adventure',q:'You wake up as small as a pencil. Where do you go, and what is dangerous?',k:['First, I would go to …','Then, I would …','It is dangerous because …','What would you do?']},
 {t:'Animal swap',q:'You can change bodies with an animal for one day. Which animal do you choose?',k:['I would choose a …','I could …, but I could not …','That would be great because …','Would you choose the same?']},
 {t:'Crazy invention',q:'Invent a machine that solves a silly problem. What does it do?',k:['My machine is called …','It can …','I think it is useful because …','Would you buy it?']},
 {t:'Odd restaurant',q:'Open the strangest restaurant in town. What is its name, and what is on the menu?',k:['My restaurant would be called …','We would serve …','In my opinion, the best dish is …','Would you eat there?']},
 {t:'Invisible day',q:'You are invisible for one day. What funny things do you do?',k:['First, I would …','After that, I would …','I would not … because …','What about you?']},
 {t:'Mixed-up world',q:'Imagine a world where everything is backwards. Describe one normal day there.',k:['In this world, people …','I think children would …','It would be funny because …','Do you agree?']}
];
const colours=['#d6006c','#201e1d','#0088b0','#edbb00'],ink='#201e1d',canvas=document.getElementById('wheel'),ctx=canvas.getContext('2d'),N=topics.length;
function draw(){const c=450,r=430;ctx.clearRect(0,0,900,900);for(let i=0;i<N;i++){const a=-Math.PI/2+i*2*Math.PI/N,b=-Math.PI/2+(i+1)*2*Math.PI/N;ctx.beginPath();ctx.moveTo(c,c);ctx.arc(c,c,r,a,b);ctx.closePath();ctx.fillStyle=colours[i%4];ctx.fill();ctx.strokeStyle='#f8f4f4';ctx.lineWidth=4;ctx.stroke();ctx.save();ctx.translate(c,c);ctx.rotate((a+b)/2);ctx.textAlign='right';ctx.textBaseline='middle';ctx.fillStyle=i%4===3?ink:'#fff';ctx.font='bold 28px Georgia';ctx.fillText(topics[i].t.toUpperCase(),395,0);ctx.restore()}ctx.beginPath();ctx.arc(c,c,r,0,2*Math.PI);ctx.strokeStyle=ink;ctx.lineWidth=14;ctx.stroke()}
draw();let rotation=0,last=-1,spinning=false,secs=120,remaining=120,timer=null;
const spin=document.getElementById('spin'),intro=document.getElementById('intro'),card=document.getElementById('card'),clock=document.getElementById('clock');
function spinWheel(){if(spinning)return;spinning=true;spin.disabled=true;let idx;do{idx=Math.floor(Math.random()*N)}while(idx===last);last=idx;resetTimer();intro.style.display='none';card.classList.remove('show');const seg=360/N,desired=(-90-(idx*seg+seg/2)+3600)%360,cur=((rotation%360)+360)%360;rotation+=((desired-cur)+360)%360+2160;canvas.style.transform=`rotate(${rotation}deg)`;setTimeout(()=>{document.getElementById('number').textContent='NO. '+String(idx+1).padStart(2,'0');document.getElementById('title').textContent=topics[idx].t;document.getElementById('question').textContent=topics[idx].q;const phrases=document.getElementById('phrases');phrases.replaceChildren(...topics[idx].k.map(text=>{const line=document.createElement('div');line.textContent='• '+text;return line}));card.classList.add('show');spinning=false;spin.disabled=false},4650)}
spin.addEventListener('click',spinWheel);canvas.addEventListener('click',spinWheel);canvas.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();spinWheel()}});
function fmt(n){return String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0')}function paint(){clock.textContent=remaining?fmt(remaining):"Time's up!";clock.style.color=remaining?'#201e1d':'#d6006c'}function resetTimer(){clearInterval(timer);timer=null;remaining=secs;paint();document.getElementById('start').disabled=false}document.querySelectorAll('[data-sec]').forEach(b=>b.onclick=()=>{if(timer)return;secs=remaining=+b.dataset.sec;document.querySelectorAll('[data-sec]').forEach(x=>x.classList.toggle('active',x===b));paint()});document.getElementById('start').onclick=e=>{if(timer)return;e.target.disabled=true;timer=setInterval(()=>{remaining--;paint();if(remaining<=0){clearInterval(timer);timer=null;e.target.disabled=false}},1000)};document.getElementById('reset').onclick=resetTimer;
</script>
</body>
</html>
